<!--
  THE TAB MARK — the app icon's three bars, alone.

  Not the app icon. At 16px the icon is unreadable and it was measured rather
  than guessed: the bars cover 27% of the tile and the plate another 25%, so
  three bars get 66 pixels between them and smear into each other. The plate is
  what eats the space, so the tab mark drops it.

  Laid out on a 16-unit grid so every edge lands on a pixel boundary at the one
  size that matters: 1u margin, 4u bars, 1u gaps, common baseline at y=15. The
  heights keep the icon's proportions (10 / 14 / 11 against its 424 / 582 / 458).

  The fills are the app's OWN values, not a fourth set: #E8833A is
  ClaudeSource.tintHex, #2FBFA8 is CodexSource.tintHex, and #8D78F5 is
  lancetta-5, the brand accent that stands for no agent. On a light tab they
  measure about 2:1, which is low for text and fine for a 4px solid — the mark
  is carried by three distinct hues at three distinct heights, and darkening
  them to chase a text ratio would stop them being the app's colours.

  `public/brand-mark.svg` is the faithful redraw of the whole icon, for anywhere
  it is drawn large.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Lancetta">
  <rect x="1"  y="5" width="4" height="10" rx="2" fill="#E8833A"/>
  <rect x="6"  y="1" width="4" height="14" rx="2" fill="#2FBFA8"/>
  <rect x="11" y="4" width="4" height="11" rx="2" fill="#8D78F5"/>
</svg>
