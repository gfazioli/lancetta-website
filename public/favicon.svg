<!--
  THE TAB MARK — the app icon's FLAT variant, redrawn as vector.

  Why a variant at all: the gradient icon does not survive 16px, and that was
  measured rather than judged by eye. Its bars cover 27% of the tile and its
  plate another 25%, so three bars share 66 pixels; its gradients and rim glow
  then smear what is left into mud. The flat variant has no gradient and no
  glow, so each bar stays one solid colour all the way down to 2px wide.

  Full bleed, because the artwork is: the 2026-09-18 masters touch all four
  edges (only the corners are transparent), which is also what Netfox and
  FinderGit ship — their icons measure 256 of 256 px at every alpha threshold.

  Geometry and fills are MEASURED off `Lancetta/Brand/app-icon-flat-1024.png`
  with `Lancetta/scripts/icons.swift` (colorbox for each bar, radius for the
  corner), then scaled to this viewBox. Nothing here was picked by hand, and
  `scripts/icons.sh` regenerates every raster beside it from the same master.

  `public/brand-mark.svg` is the gradient icon, for anywhere it is drawn large.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Lancetta">
  <rect x="0" y="0" width="16" height="16" rx="3.55" fill="#08306F"/>
  <rect x="1.51"  y="5.65" width="3.81" height="7.96"  rx="1.91" fill="#FB8E00"/>
  <rect x="6.04"  y="2.4" width="3.9" height="11.25" rx="1.95" fill="#08F5C3"/>
  <rect x="10.68" y="5.21" width="3.85" height="8.41"  rx="1.93" fill="#9253F9"/>
</svg>
